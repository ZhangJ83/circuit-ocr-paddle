### data
train_dataset_type: messages
eval_dataset_type: messages
train_dataset_path: /root/circuit_ocr/output/train_clean.jsonl
eval_dataset_path: /root/circuit_ocr/output/val_clean.jsonl
max_seq_len: 16384
padding_free: True
truncate_packing: False
dataloader_num_workers: 4
mix_strategy: concat
template_backend: custom
template: paddleocr_vl

### model
model_name_or_path: /root/models/official_models/PaddleOCR-VL
_attn_implementation: flashmask
lora: true
lora_rank: 16

### finetuning
# base
stage: VL-SFT
fine_tuning: lora
seed: 23
do_train: true
do_eval: false
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
num_train_epochs: 2
max_steps: -1
logging_steps: 10
save_steps: 400
save_strategy: steps
gradient_accumulation_steps: 16

# train
lr_scheduler_type: cosine
warmup_ratio: 0.01
learning_rate: 5.0e-4
min_lr: 5.0e-5

# optimizer
weight_decay: 0.1

# performance
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
sharding: stage2
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
bf16: true

# save
unified_checkpoint: false
save_checkpoint_format: "flex_checkpoint"
load_checkpoint_format: "flex_checkpoint"
output_dir: /root/circuit_ocr/checkpoints/official_lora
